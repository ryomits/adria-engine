[project]
name = "adria-harness"
version = "0.1.0"
description = "ADRIA harness: local voice loop (STT -> Ollama -> Irodori-TTS)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "mlx-whisper>=0.4",
    "silero-vad>=5.1",
    "speechbrain==1.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]
tools = [
    "matplotlib>=3.11.2",
]

[project.scripts]
adria = "adria_harness.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adria_harness*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
