<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ADRIA</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
      canvas { display: block; }
      #debug { position: fixed; left: 8px; top: 8px; font: 12px/1.4 ui-monospace, monospace;
               color: #fff; background: rgba(0,0,0,.55); padding: 4px 8px; border-radius: 4px;
               white-space: pre; display: none; }
      body.checker { background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 24px 24px; }
      #stage { position: fixed; inset: 0; }
      /* Conversation state: color and icon (see src/indicator/stateBadge.ts). */
      #state-badge { position: fixed; right: 10px; top: 10px; width: 30px; height: 30px;
                     border-radius: 50%; display: grid; place-items: center;
                     box-shadow: 0 1px 4px rgba(0,0,0,.25); transition: background-color .4s; }
      #state-badge svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2.2;
                         stroke-linecap: round; stroke-linejoin: round; }
      #state-badge[data-state="thinking"] svg { stroke-width: 4; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="debug"></div>
    <script>
      // Report load-time errors (e.g. a module that failed to load) to the native log.
      addEventListener("error", (e) => {
        window.webkit?.messageHandlers?.log?.postMessage(`error: ${e.message || e.target?.src || "unknown"}`);
      }, true);
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
