# Example of ADRIA_HOME/config.toml. Copy into the private home directory and edit.

[general]
# Spoken while the LLM is being reloaded after an idle unload.
fillers = ["うーんとね。", "えっとね。", "んーとね。"]

[llm]
model = "qwen3:30b-a3b-instruct-2507-q4_K_M"
keep_alive = "10m"
history_turns = 8
options = { temperature = 0.7, num_ctx = 4096 }

[tts]
# Absolute path, or relative to this home directory.
server_dir = "/path/to/Irodori-TTS-Server"
checkpoint = "Aratako/Irodori-TTS-v4-Small"
device = "mps"
# "none" = voice design from the caption only. Run `adria make-voice adria`
# and set voice = "adria" to lock the timbre across lines.
voice = "none"
caption = "明るくやさしい声。ゆっくりした話し方。"
num_steps = 16
idle_stop_sec = 1800

[stt]
model = "mlx-community/whisper-large-v3-turbo"
language = "ja"
min_silence_ms = 700

[personas]
# File name under personas/ (without .md). Used for unknown or unmapped
# speakers, so it must be the child persona (fail-safe).
default = "child"

[speakers]
# Cosine similarity needed to recognize an enrolled speaker, and the lead over
# the next closest one. Raise them if family members get confused.
threshold = 0.70
margin = 0.1
min_audio_sec = 1.0
enroll_sec = 20

[speakers.map]
# speaker id (from `adria enroll <id>`) = persona name
# parent1 = "parent"
# parent2 = "parent"
# kid = "child"

[memory]
idle_end_sec = 300              # a conversation ends after 5 minutes of silence
max_chars = 2000                # merge the summaries above this size
transcript_retention_days = 7   # full logs in conversation-logs/ (never sent to the LLM)
